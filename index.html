<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Multiplier</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- Project Main Container -->
         <div class="container">
            <!-- Title of the Project -->
            <div class="title">
                <h1>Multiplier Project</h1>
                <p>This is a Multiplier project, in which you can multiply a specific number 10 times. It means that those who have somthing to do with calculations and are at school, university or Financial Affairs, can use this project as a source which will help them too much.</p>
            </div>
            <!-- Main Contents of the Project -->
            <form class="content">
                <input type="number" id="num" placeholder="Type a number">
                <button id="btn" disabled="">Good Luck!</button>
            </form>

            <!-- Result Output Place -->
            <div class="result"></div>
            
         </div>

         <script src="script.js"></script>
    </body>
</html>
